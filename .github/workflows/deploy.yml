name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than pushing a half-built site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gravproperty
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gravproperty/package-lock.json

      - run: npm ci
      - run: npm test

      # Client ID and tenant ID are baked into the bundle at build time. They
      # are public identifiers, not secrets — Microsoft still verifies every
      # sign-in against the single-tenant app registration. Repo variables,
      # not secrets, so they stay readable in the Actions UI.
      - run: npm run build
        env:
          VITE_MSAL_CLIENT_ID: ${{ vars.VITE_MSAL_CLIENT_ID }}
          VITE_MSAL_TENANT_ID: ${{ vars.VITE_MSAL_TENANT_ID }}

      # path is relative to the workspace root, not the working-directory above.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gravproperty/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
